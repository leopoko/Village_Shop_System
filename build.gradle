plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// === CHANGELOG.md から最新バージョンのセクションのみ抽出 ===
def extractLatestChangelog() {
    def changelogFile = file("CHANGELOG.md")
    if (!changelogFile.exists()) return "v${project.mod_version}"

    def lines = changelogFile.text.readLines()
    def result = []
    def found = false

    for (line in lines) {
        if (line.matches(/^## \[.*].*/) && !found) {
            found = true
            continue
        }
        if (line.matches(/^## \[.*].*/) && found) {
            break
        }
        if (found) {
            result << line
        }
    }

    def text = result.join("\n").trim()
    return text.isEmpty() ? "v${project.mod_version}" : text
}

// === MOD公開設定 ===
publishMods {
    changelog = extractLatestChangelog()
    type = STABLE

    // CurseForge 共通設定
    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = project.curseforge_project_id
        projectSlug = "village-shop-system"
        minecraftVersions.add("1.20.1")
        javaVersions.add(JavaVersion.VERSION_17)
        requires("architectury-api")
        requires("cloth-config")
        // CurseForge は環境グループ (Client/Server) の指定を必須とする（未指定だと 400 で拒否される）。
        // ブロック・村人AIはサーバー側、GUIとツールチップはクライアント側にあるため両方必要。
        clientRequired = true
        serverRequired = true
    }

    // Fabric版
    curseforge("curseforgeFabric") {
        from cfOptions
        file = project(":fabric").remapJar.archiveFile
        displayName = "Village_Shop_System_v${project.mod_version} (Fabric)"
        modLoaders.add("fabric")
        requires("fabric-api")
    }

    // Forge版
    curseforge("curseforgeForge") {
        from cfOptions
        file = project(":forge").remapJar.archiveFile
        displayName = "Village_Shop_System_v${project.mod_version} (Forge)"
        modLoaders.add("forge")
    }
}
